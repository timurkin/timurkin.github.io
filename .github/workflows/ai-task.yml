name: AI Task

# STUB — for exercising the dev-loop service, not for doing any work.
#
# Copy this over `.github/workflows/ai-task.yml` in a sandbox repository. It
# mimics every point the service actually couples to, and nothing else:
#
#   * `run-name: AI task #<n>` — the only join key between a dispatch and its
#     run, matched by equality in findRun()
#   * the `issue_number` input, same name and type
#   * a branch named `ai/issue-<n>`, which the service derives rather than reads
#   * at least one commit on it, which the service turns into the draft PR
#   * a completed check run on the pushed commit, which the service's CI wait
#     polls for — the wait the real loop used to do on a held runner
#   * the run conclusion, which decides whether the loop continues at all
#
# Note what it does *not* do any more: open the pull request. The service does
# that now, from the branch this pushes.
#
# It needs no secrets: the default GITHUB_TOKEN is enough, so a sandbox needs
# neither CLAUDE_CODE_OAUTH_TOKEN nor an APP_PRIVATE_KEY. It writes one throwaway
# file and runs in well under a minute.
#
# `ci` and `delay_seconds` are additions the real workflow does not have. The
# service never sends them, so they always take their defaults in a real
# dispatch — they exist for `gh workflow run`.

# Quoted: an unquoted `#` after a space starts a YAML comment, which would
# silently truncate this to "AI task" and break the service's run lookup.
run-name: 'AI task #${{ inputs.issue_number }}'

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Task issue to "implement".
        required: true
        type: string
      ci:
        description: >-
          What the faked check run concludes. `none` publishes no check at all,
          so the service's registration timeout can be exercised.
        required: false
        default: success
        type: choice
        options: [success, failure, none]
      delay_seconds:
        description: Pause before pushing, to watch the Slack status change.
        required: false
        default: '10'
        type: string

concurrency:
  group: ai-task-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Faking `pr-checks.yml`. The real workflow needs no such permission --
      # real checks come from the real CI.
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pretend to write code
        run: sleep "${{ inputs.delay_seconds }}"

      - name: Push a throwaway change
        id: branch
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          BRANCH="ai/issue-${ISSUE_NUMBER}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH" --quiet
            git checkout -B "$BRANCH" "origin/${BRANCH}"
          else
            git checkout -B "$BRANCH" "origin/${GITHUB_REF_NAME}"
          fi

          mkdir -p .dev-loop-sandbox
          # Appending, not overwriting: a follow-up /ai-fix dispatch must produce
          # a *new* commit, otherwise there is nothing to push and the loop
          # correctly refuses to advance.
          echo "- run ${GITHUB_RUN_ID} at $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            >> ".dev-loop-sandbox/issue-${ISSUE_NUMBER}.md"

          git add ".dev-loop-sandbox/issue-${ISSUE_NUMBER}.md"
          git commit -m "feat(sandbox): simulated work for ai-task #${ISSUE_NUMBER}"
          git push origin "HEAD:${BRANCH}"

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Stands in for pr-checks.yml. The service polls
      # /commits/{sha}/check-runs and will not dispatch a review round until
      # something there is `completed`, so without this the sandbox task parks in
      # awaiting_ci until the registration timeout.
      - name: Publish a fake check run
        if: inputs.ci != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.branch.outputs.sha }}
          CONCLUSION: ${{ inputs.ci }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name='stub-ci' \
            -f head_sha="$HEAD_SHA" \
            -f status='completed' \
            -f conclusion="$CONCLUSION" \
            --jq '.id'
